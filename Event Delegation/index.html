<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #box{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 10px;
        }
        .card{
            background-color: aqua;
            height: 30vh;
            text-align: center;
        }

        #cart{
            height: 20vh;
            width: 30vw;
            border: 2px solid black;
            margin-top: 10px;
        }
    </style>

</head>
<body>
    <h1>Event delegation</h1>

    <main id="box">
        <article class="card">Milk</article>
        <article class="card">dahi</article>
        <article class="card">chhach</article>
        <article class="card">bread</article>
        <article class="card">cake</article>
        <article class="card">chips</article>
        <article class="card">cokies</article>
        <article class="card">panneer</article>
    </main>



    <footer id="cart">

    </footer>








    <script src="app.js"></script>
</body>
</html>
